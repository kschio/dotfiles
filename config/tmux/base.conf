# tmux — base config
# Oxocarbon theme.


# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true-color passthrough
set -sg escape-time 0                       # no delay after Esc
set -g focus-events on
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string "#S"
set -g default-shell /opt/homebrew/bin/fish


# -- display -------------------------------------------------------------------

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g status-position bottom
set -g display-panes-time 800
set -g display-time 1000


# -- Oxocarbon theme ----------------------------------------------------------

set -g window-style "fg=default,bg=default"
set -g window-active-style "bg=default"

# Pane borders — focus shown via border + title color (preserves Ghostty opacity)
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#525252"
set -g pane-border-format " #{b:pane_current_path} · #{pane_current_command} "

set -g display-panes-colour "#33b1ff"
set -g display-panes-active-colour "#33b1ff"

set -g message-style "fg=#161616,bg=#ffe97b,bold"
set -g message-command-style "fg=#ffe97b,bg=default,bold"
set -g mode-style "fg=#161616,bg=#ffe97b,bold"

set -g clock-mode-colour "#33b1ff"
set -g clock-mode-style 24


# -- status bar ----------------------------------------------------------------

set -g status on
set -g status-style "fg=#525252,bg=default"
set -g status-left-length 100
set -g status-right-length 100

set -g status-left " #[fg=#dde1e6]#S  #[fg=#393939]|  "
set -g status-right "#[fg=#525252]%R "


# -- window status -------------------------------------------------------------

set -g window-status-separator "  "

set -g window-status-style "fg=#525252,bg=default"
set -g window-status-current-style "fg=#dde1e6,bg=default"
set -g window-status-activity-style "fg=#525252,bg=default"
set -g window-status-bell-style "fg=#ffe97b,bg=default,bold"
set -g window-status-last-style "fg=#525252,bg=default"

set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"


# -- mouse ---------------------------------------------------------------------

set -g mouse on

bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down


# -- copy mode (vi) ------------------------------------------------------------

set-window-option -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"


# -- hooks ---------------------------------------------------------------------

set-hook -g after-split-window[100] 'select-pane -T "pane #{window_panes}"'
set-hook -g after-new-window[100]   'rename-window "fish" ; select-pane -T "pane 1"'
set-hook -g after-new-session[100]  'select-pane -T "pane 1"'


# -- environment ---------------------------------------------------------------

set-environment -g SESSIONIZER_DIR "$HOME/Development"
